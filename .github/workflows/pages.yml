name: Validate and publish specification

on:
  push:
    branches: [gh-pages]
  pull_request:
    branches: [gh-pages]
  workflow_dispatch:

env:
  MDBOOK_VERSION: "0.5.4"

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    name: Validate metadata and build the book
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install metadata validator
        run: pip install check-jsonschema

      - name: Validate glyphnames.json against schema
        run: check-jsonschema --schemafile metadata/schema/glyphnames.schema.json metadata/glyphnames.json

      - name: Validate ranges.json against schema
        run: check-jsonschema --schemafile metadata/schema/ranges.schema.json metadata/ranges.json

      - name: Validate classes.json against schema
        run: check-jsonschema --schemafile metadata/schema/classes.schema.json metadata/classes.json

      - name: Check cross-file metadata consistency
        run: python3 metadata/schema/check_consistency.py

      - name: Check codepoint immutability against v1.4
        run: python3 metadata/schema/check_immutability.py

      - name: Validate data/ranges/*.yaml against schema
        run: find data/ranges -name '*.yaml' ! -name 'manifest.yaml' -print0 | xargs -0 check-jsonschema --schemafile data/schema/range.schema.json

      - name: Validate data/ranges/manifest.yaml against schema
        run: check-jsonschema --schemafile data/schema/manifest.schema.json data/ranges/manifest.yaml

      - name: Validate data/stylistic-sets.yaml against schema
        run: check-jsonschema --schemafile data/schema/stylistic-sets.schema.json data/stylistic-sets.yaml

      - name: Validate data/engraving-defaults.yaml against schema
        run: check-jsonschema --schemafile data/schema/engraving-defaults.schema.json data/engraving-defaults.yaml

      - name: Validate data/bravura-text-transforms.yaml against schema
        run: check-jsonschema --schemafile data/schema/bravura-text-transforms.schema.json data/bravura-text-transforms.yaml

      - name: Validate data/font-version.yaml against schema
        run: check-jsonschema --schemafile data/schema/font-version.schema.json data/font-version.yaml

      - name: Install generator dependencies
        run: pip install pyyaml fonttools ufoLib2

      - name: Check generated output matches committed metadata and tables
        run: python3 tools/generate.py --check

      - name: Check Bravura.ufo has a glyph for every spec-defined codepoint
        run: python3 tools/sync_ufo_glyphs.py --check

      - name: Check the font version was bumped for any material change
        run: python3 tools/check_font_version.py

      - name: Install font build dependencies
        run: pip install fontmake afdko

      - name: Build Bravura.otf and Bravura.json (validates the UFO compiles cleanly)
        run: python3 tools/generate_font.py --output /tmp/Bravura.otf --metadata-output /tmp/Bravura.json

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/mdbook-bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/mdbook-bin"
          echo "$HOME/mdbook-bin" >> "$GITHUB_PATH"

      - name: Build the book
        working-directory: mdbook
        run: mdbook build

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/gh-pages'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install font build dependencies
        run: pip install pyyaml fonttools fontmake afdko

      - name: Build Bravura.otf and Bravura.json
        run: python3 tools/generate_font.py --output font/Bravura.otf --metadata-output font/Bravura.json

      - name: Copy Bravura.otf and Bravura.json into the book's media folder
        run: |
          cp font/Bravura.otf mdbook/src/media/Bravura.otf
          cp font/Bravura.json mdbook/src/media/Bravura.json

      - name: Build BravuraText.woff
        run: python3 tools/generate_bravura_text.py --output font/BravuraText.woff

      - name: Copy BravuraText.woff into the book's media folder
        run: cp font/BravuraText.woff mdbook/src/media/BravuraText.woff

      - name: Install mdBook
        run: |
          mkdir -p "$HOME/mdbook-bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/mdbook-bin"
          echo "$HOME/mdbook-bin" >> "$GITHUB_PATH"

      - name: Build the book
        working-directory: mdbook
        run: mdbook build

      - name: Assemble site
        run: |
          rm -rf _site
          mkdir _site
          cp -r mdbook/book _site/latest
          cp -r drafts _site/drafts
          cp -r releases _site/releases
          cp -r gitbook _site/gitbook
          cp -r metadata _site/metadata
          cp index.html _site/index.html
          cp w3c.json _site/w3c.json

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
