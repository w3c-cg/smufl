# The full OpenType stylistic-set budget for the font is 20 (ss01-ss20). A
# range's stylistic alternate declares "set: <id>" to join one of these;
# omitting "set" makes it a plain alternate (.saltNN, numbered per base
# glyph, assigned automatically). Each id here must have exactly one
# consistent meaning across every glyph family that uses it.
#
# ss05 is intentionally absent: it was a duplicate of ss08 ("oversized"),
# used only for noteheadDoubleWhole, noteheadDoubleWholeSquare,
# noteheadWhole, noteheadHalf and noteheadBlack. Those 5 glyphs are recorded
# here under "oversized" (ss08), and as of the font-build-pipeline PR,
# Bravura.ufo's own features.fea/glyph names have been corrected to match -
# ss05 no longer appears anywhere in the font. It stays reserved/unused
# rather than reassigned to a new concept.
sets:
  - id: small-staff
    opentype: ss01
    description: Smaller optical size for small staves
  - id: short
    opentype: ss02
    description: Short flags (to avoid augmentation dots)
  - id: straight
    opentype: ss03
    description: Straight flags
  - id: outside-staff
    opentype: ss04
    description: Large time signatures
  - id: oversized
    opentype: ss08
    description: Oversized noteheads and slash noteheads
  - id: light
    opentype: ss06
    description: Tuplet numbers at a lighter weight
  - id: superscript-or-subscript
    opentype: ss07
    description: Smaller optical size for subscript and superscript placement
  - id: large-narrow
    opentype: ss09
    description: Large, narrow time signatures
  - id: longer-stem
    opentype: ss10
    description: Accidentals for figured bass with longer stems
